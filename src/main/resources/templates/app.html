<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="_csrf" th:content="${_csrf.token}" />
    <meta name="_csrf_header" th:content="${_csrf.headerName}" />
    <title>Smart Mess · Campus dining</title>
    <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/responsive.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="/">◈ smart<span>mess</span></a>
      <div class="workspace">
        <span class="workspace-icon">U</span>
        <div>University Hostel<small>Campus dining workspace</small></div>
      </div>
      <small class="nav-label">WORKSPACE</small>
      <nav id="nav"></nav>
      <div class="sidebar-bottom">
        <form th:action="@{/logout}" method="post">
          <button class="logout">↪ Sign out</button>
        </form>
      </div>
    </aside>
    <div class="main">
      <header>
        <div class="breadcrumb">
          Workspace <span>/</span> <b id="breadcrumb">Overview</b>
        </div>
        <div class="header-right">
          <span class="live">● System live</span
          ><span class="avatar" id="avatar">S</span><span id="username"></span>
        </div>
      </header>
      <main id="content"><p>Loading your workspace…</p></main>
    </div>
    <div id="toast" role="status"></div>
    <script src="/vendor/chart.umd.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
